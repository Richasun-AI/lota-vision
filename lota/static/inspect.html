<style>
  .drop { border: 2px dashed var(--line-2); border-radius: var(--r-lg); padding: 26px; text-align: center; background: var(--panel); color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--brand-500); background: var(--brand-50); }
  .rule { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin: 6px 0; }
  .rule .input, .rule .select { height: 30px; width: auto; }
  .verdict-fail { border-left: 4px solid var(--danger); } .verdict-warn { border-left: 4px solid #d9922b; } .verdict-pass { border-left: 4px solid var(--ok); }
  .res { display: grid; grid-template-columns: 180px 1fr; gap: 12px; align-items: start; }
  .res b { word-break: break-all; }
  .res canvas { width: 180px; border-radius: 8px; background: #e7ece9; cursor: zoom-in; }
</style>
