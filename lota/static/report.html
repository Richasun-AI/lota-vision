<style>
  .verdict-big { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 14px; }
  .verdict-big .v { font-size: 30px; font-weight: 800; }
  .verdict-big.fail { background: var(--danger-bg); color: var(--danger); } .verdict-big.warn { background: var(--warn-bg); color: var(--warn); }
  .verdict-big.pass { background: var(--ok-bg); color: var(--ok); } .verdict-big.skip { background: #eef1ef; color: var(--muted); }
  .issue { display: grid; grid-template-columns: 220px 1fr; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; break-inside: avoid; }
  .issue canvas { width: 220px; border-radius: 8px; background: #e7ece9; }
  @media print {
    .topnav, .noprint { display: none !important; }
    body { background: #fff; } .page { padding: 0; max-width: none; } .card { box-shadow: none; }
  }
</style>
