<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="/static/i18n.js?v=19"></script><script src="/static/combo.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用指南 · LOTA</title>
<link rel="stylesheet" href="/static/ui.css?v=2">
<script src="/static/ui.js?v=13"></script>
<style>
  .guide { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
  .toc { position: sticky; top: 70px; display: grid; gap: 2px; }
  .toc a { padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; }
  .toc a:hover { background: var(--brand-50); text-decoration: none; }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
  .steps li { counter-increment: s; position: relative; padding: 8px 12px 8px 44px; background: var(--panel-2); border-radius: 10px; }
  .steps li::before { content: counter(s); position: absolute; left: 12px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-700); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .q { font-weight: 650; margin-top: 10px; }
  @media (max-width: 900px) { .guide { grid-template-columns: 1fr; } .toc { position: static; } }
</style>
</head>
<body>
<main class="page" id="app"></main>
<script src="/static/guide.js?v=2"></script>
</body>
</html>
