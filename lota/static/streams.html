<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="/static/i18n.js?v=18"></script><script src="/static/combo.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时监控 · LOTA</title>
<link rel="stylesheet" href="/static/ui.css?v=2">
<script src="/static/ui.js?v=13"></script>
<style>
  .cams { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .cam { padding: 0; overflow: hidden; }
  .cam .screen { position: relative; aspect-ratio: 16/9; background: #0f1513; display: grid; place-items: center; color: #9fb3ab; font-size: 13px; cursor: zoom-in; }
  .cam .screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .screen .over { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .cam .meta { padding: 10px 12px; display: grid; gap: 6px; }
  .cam .meta .t { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cam .meta h3 { margin: 0; font-size: 15px; }
  .big { width: 100%; max-height: 72vh; object-fit: contain; background: #0f1513; border-radius: 10px; display: block; }
  .events { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .ev { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; position: relative; }
  .ev img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #0f1513; cursor: zoom-in; }
  .ev .cap { padding: 6px 8px; font-size: 12px; display: grid; gap: 2px; }
  .ev input[type=checkbox] { position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; }
  .two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .three { display: grid; gap: 12px; grid-template-columns: 2fr 1fr 1fr; }
  @media (max-width: 640px) { .two, .three { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="page" id="app"><div class="empty">加载中…</div></main>
<script src="/static/streams.js?v=1"></script>
</body>
</html>
